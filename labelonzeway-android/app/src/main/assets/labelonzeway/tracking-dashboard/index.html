<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Tracking dashboard · LabelOnZeWay</title>
  <style>
    :root{color-scheme:light;--navy:#111b25;--blue:#22577a;--orange:#f15a32;--green:#16845b;--red:#b63c32;--bg:#f1f2ef;--paper:#fff;--line:#d7dcd9;--muted:#64717b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:sticky;top:0;z-index:3;background:var(--navy);color:#fff;border-bottom:5px solid var(--orange);padding:14px clamp(14px,4vw,42px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.06em}.top h1{font-size:18px;margin:0}.top .spacer{flex:1}.top button,.top select{min-height:38px;border:1px solid #ffffff55;border-radius:7px;padding:7px 11px;background:#fff;color:var(--navy);font-weight:750}.wrap{width:min(1280px,100%);margin:auto;padding:18px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 8px 24px #19232c0c}.login{width:min(460px,100%);margin:8vh auto}.login h2{margin:0 0 5px}.login label{display:block;font-weight:800;margin-top:12px}.login input{width:100%;min-height:44px;margin-top:5px;border:1px solid #b8c2ca;border-radius:7px;padding:9px;font:inherit}.primary{min-height:42px;border:0;border-radius:7px;background:var(--blue);color:#fff;font-weight:800;padding:9px 15px;margin-top:14px}.status{margin-top:12px;color:var(--muted)}.status.error{color:var(--red)}.controls{display:grid;grid-template-columns:minmax(180px,1fr) 180px auto;gap:8px;margin-bottom:14px}.controls input,.controls select{min-height:42px;border:1px solid var(--line);border-radius:7px;padding:8px;font:inherit}.metrics{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:8px;margin-bottom:14px}.metric{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fafbf9}.metric small{display:block;color:var(--muted);font-weight:700}.metric b{display:block;font-size:20px;margin-top:2px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;min-width:920px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e8ebe8;vertical-align:top}th{position:sticky;top:0;background:var(--navy);color:#fff;font-size:11px;letter-spacing:.04em}td small{display:block;color:var(--muted);margin-top:2px}.pill{display:inline-block;border:1px solid var(--blue);border-radius:999px;padding:4px 8px;font-weight:800;color:var(--blue);white-space:nowrap}.pill.delivered{border-color:var(--green);color:var(--green)}.pill.exception{border-color:var(--red);color:var(--red)}.empty{padding:28px;text-align:center;color:var(--muted)}@media(max-width:700px){.wrap{padding:10px}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.metrics{grid-template-columns:repeat(2,1fr)}.metric:last-child{grid-column:1/-1}.top h1{font-size:15px}}
  </style>
<style id="approved-operations-neon-theme">
:root{color-scheme:dark;--navy:#08111b;--blue:#36cde9;--orange:#ff6b3d;--green:#35dfa6;--red:#ff6f63;--bg:#08111b;--paper:#101b27;--line:#2a3c43;--muted:#8ca39f;--neon:#2edfc1}body{background:radial-gradient(circle at 80% 0,#2edfc11a,transparent 30%),var(--bg);color:#edf8f6}.top{background:#070d14;border-bottom:2px solid var(--neon);box-shadow:0 8px 30px #0006}.brand{color:var(--neon)}.top button,.top select{background:#13232c;color:#dffaf5;border-color:#3d6b64}.wrap{width:min(1440px,100%)}.panel{background:var(--paper);border-color:var(--line);box-shadow:0 14px 38px #0003}.login input,.controls input,.controls select{background:#0c151f;color:#f1fbfa;border-color:#38504f}.primary{background:var(--neon);color:#061511}.metric{background:#0c1721;border-color:var(--line);border-top:2px solid #62726f}.metric:nth-child(3){border-top-color:#36cde9}.metric:nth-child(4){border-top-color:var(--green)}.metric:nth-child(5){border-top-color:var(--red)}.table-wrap{border-color:var(--line)}th{background:#0a141e;color:#8fe6d7}td{border-bottom-color:#26363b}tbody tr:hover{background:#14252b}.pill{border-color:#36cde9;color:#70def3}.pill.delivered{border-color:var(--green);color:var(--green)}.pill.exception{border-color:var(--red);color:#ff8c83}.empty{color:var(--muted)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2edfc166;outline-offset:2px}@media(max-width:700px){.top{padding:11px 12px}.top h1{width:100%;order:2;color:#9db0ad}.wrap{padding:8px}.panel{padding:11px;border-radius:9px}.controls input,.controls select,.top button,.top select{font-size:16px;min-height:44px}.table-wrap{border:0;overflow:visible}table,thead,tbody,tr,th,td{display:block}table{min-width:0}thead{position:absolute;clip:rect(0 0 0 0)}tbody{display:grid;gap:9px}tr{border:1px solid var(--line);border-left:4px solid var(--neon);border-radius:8px;padding:10px;background:#0c1721}td{display:grid;grid-template-columns:105px 1fr;gap:8px;padding:6px 2px;border:0}td::before{color:#7f9994;font-size:10px;font-weight:800;letter-spacing:.06em}td:nth-child(1)::before{content:'ORDER'}td:nth-child(2)::before{content:'CUSTOMER'}td:nth-child(3)::before{content:'DELIVERY'}td:nth-child(4)::before{content:'STATUS'}td:nth-child(5)::before{content:'LAST UPDATE'}td:nth-child(6)::before{content:'SOURCE'}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{background:radial-gradient(circle at 82% -10%,rgba(46,223,193,.2),transparent 34%),radial-gradient(circle at 8% 45%,rgba(54,205,233,.07),transparent 28%),linear-gradient(155deg,#040a10,#08131d 56%,#061018);background-attachment:fixed}.top{background:linear-gradient(105deg,rgba(4,10,16,.98),rgba(11,28,38,.98));border-bottom:1px solid rgba(46,223,193,.65)}.brand{text-shadow:0 0 18px rgba(46,223,193,.35)}.panel{background:linear-gradient(145deg,rgba(16,30,42,.98),rgba(8,19,28,.98));border-color:#2c454c;box-shadow:0 18px 48px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.025)}.login{border-top:3px solid var(--neon)}.primary{box-shadow:0 0 22px rgba(46,223,193,.18)}.metric{background:linear-gradient(145deg,#0c1a24,#09151f)}
</style>
</head>
<body>
  <header class="top"><span class="brand">LABELONZEWAY</span><h1>View-only Tracking Dashboard</h1><span class="spacer"></span><select id="workspace" hidden aria-label="Workspace"></select><button id="refresh" hidden>Refresh</button><button id="signout" hidden>Sign out</button></header>
  <main class="wrap">
    <section class="panel login" id="login"><h2>Staff sign in</h2><p>Authorized workspace members only. This dashboard cannot edit operational records.</p><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="signin">Sign in securely</button><div class="status" id="login-status">Loading secure connection…</div></section>
    <section class="panel" id="dashboard" hidden>
      <div class="controls"><input id="search" type="search" placeholder="Search order, customer, phone or area"><select id="filter"><option value="all">All statuses</option><option value="ready">Ready for Dispatch</option><option value="in_transit">In Transit</option><option value="delivered">Delivered</option><option value="exception">Exception</option></select><span class="status" id="updated">Not loaded</span></div>
      <div class="metrics" id="metrics"></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Delivery</th><th>Status</th><th>Last update</th><th>Source</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>No matching parcels.</div></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
  (function(){'use strict';var client=null,session=null,workspaces=[],records=[];var login=document.getElementById('login'),dashboard=document.getElementById('dashboard'),loginStatus=document.getElementById('login-status'),workspace=document.getElementById('workspace');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function statusOf(p){var s=String(p&&p.deliveryStatus||'');return['ready','in_transit','delivered','exception'].indexOf(s)>=0?s:(p&&p.done?'delivered':'ready')}function statusLabel(s){return s==='in_transit'?'In Transit':s==='delivered'?'Delivered':s==='exception'?'Exception':'Ready for Dispatch'}function setLoginStatus(text,error){loginStatus.textContent=text;loginStatus.className='status'+(error?' error':'')}function configure(){return fetch('../sync-config.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Configuration unavailable');return r.json()}).then(function(c){if(!window.supabase||!window.supabase.createClient||!c.supabaseUrl||!c.supabaseAnonKey)throw new Error('Secure cloud configuration is unavailable');client=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});client.auth.onAuthStateChange(function(event,next){session=next;setTimeout(route,0)});return client.auth.getSession()}).then(function(r){session=r.data&&r.data.session;route()}).catch(function(e){setLoginStatus(e.message||String(e),true)})}function route(){if(!client)return;if(!session){login.hidden=false;dashboard.hidden=true;document.getElementById('signout').hidden=true;document.getElementById('refresh').hidden=true;workspace.hidden=true;setLoginStatus('Enter your existing LabelOnZeWay staff account.');return}login.hidden=true;dashboard.hidden=false;document.getElementById('signout').hidden=false;document.getElementById('refresh').hidden=false;workspace.hidden=false;loadWorkspaces()}function loadWorkspaces(){client.from('workspace_members').select('workspace_id,role,workspaces(name)').eq('user_id',session.user.id).then(function(r){if(r.error)throw r.error;workspaces=(r.data||[]).map(function(x){return{id:x.workspace_id,name:x.workspaces&&x.workspaces.name||x.workspace_id}});if(!workspaces.length)throw new Error('This staff account has no workspace membership');workspace.innerHTML=workspaces.map(function(w){return'<option value="'+esc(w.id)+'">'+esc(w.name)+'</option>'}).join('');return loadRecords()}).catch(function(e){document.getElementById('updated').textContent=e.message||String(e)})}function loadRecords(){var wid=workspace.value;if(!wid)return Promise.resolve();document.getElementById('updated').textContent='Loading…';return client.from('sync_entities').select('profile_id,entity_type,entity_id,payload,modified_at,deleted_at').eq('workspace_id',wid).in('entity_type',['parcel_active','archive_day']).is('deleted_at',null).order('modified_at',{ascending:true}).then(function(r){if(r.error)throw r.error;var map={};(r.data||[]).filter(function(x){return x.entity_type==='archive_day'}).forEach(function(x){var day=x.payload||{};(Array.isArray(day.rows)?day.rows:[]).forEach(function(p){if(!p||!p.id)return;map[x.profile_id+'|'+p.id]={parcel:p,profile:x.profile_id,source:'Archive',modified:p.statusUpdatedAt||x.modified_at}})});(r.data||[]).filter(function(x){return x.entity_type==='parcel_active'}).forEach(function(x){var p=x.payload||{};if(!p.id)return;map[x.profile_id+'|'+p.id]={parcel:p,profile:x.profile_id,source:'Active Manifest',modified:p.statusUpdatedAt||x.modified_at}});records=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return String(b.modified).localeCompare(String(a.modified))});render();document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString()}).catch(function(e){document.getElementById('updated').textContent='Load failed: '+(e.message||e)})}function render(){var q=document.getElementById('search').value.trim().toLowerCase(),filter=document.getElementById('filter').value;var counts={ready:0,in_transit:0,delivered:0,exception:0};records.forEach(function(x){counts[statusOf(x.parcel)]++});document.getElementById('metrics').innerHTML=[['All',records.length],['Ready',counts.ready],['In Transit',counts.in_transit],['Delivered',counts.delivered],['Exception',counts.exception]].map(function(x){return'<div class="metric"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>'}).join('');var shown=records.filter(function(x){var p=x.parcel,s=statusOf(p),rec=p.rec||{};var hay=[p.oid,p.id,rec.name,rec.phone,rec.area,rec.address].join(' ').toLowerCase();return(filter==='all'||filter===s)&&(!q||hay.indexOf(q)>=0)});document.getElementById('rows').innerHTML=shown.map(function(x){var p=x.parcel,rec=p.rec||{},s=statusOf(p),reason=s==='exception'&&p.deliveryExceptionReason?'<small>'+esc(p.deliveryExceptionReason)+'</small>':'';return'<tr><td><b>'+esc(p.oid||p.id||'—')+'</b><small>'+esc(x.profile)+'</small></td><td><b>'+esc(rec.name||'—')+'</b><small>'+esc(rec.phone||[rec.address,rec.area].filter(Boolean).join(', ')||'')+'</small></td><td>'+esc(p.deliverAt||'Not scheduled')+'<small>'+esc(p.deliverTime||'')+'</small></td><td><span class="pill '+esc(s)+'">'+esc(statusLabel(s))+'</span>'+reason+'</td><td>'+esc(x.modified||'—')+'</td><td>'+esc(x.source)+'</td></tr>'}).join('');document.getElementById('empty').hidden=!!shown.length}document.getElementById('signin').onclick=function(){var email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){setLoginStatus('Enter email and password.',true);return}setLoginStatus('Signing in…');client.auth.signInWithPassword({email:email,password:password}).then(function(r){if(r.error)throw r.error;document.getElementById('password').value=''}).catch(function(e){setLoginStatus('Sign-in failed: '+(e.message||e),true)})};document.getElementById('signout').onclick=function(){client.auth.signOut()};document.getElementById('refresh').onclick=loadRecords;workspace.onchange=loadRecords;document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;configure();setInterval(function(){if(session&&!document.hidden)loadRecords()},30000)})();
  </script>
</body>
</html>
