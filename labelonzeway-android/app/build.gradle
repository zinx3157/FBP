plugins {
    id 'com.android.application'
}

android {
    namespace 'com.labelonzeway.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.labelonzeway.app'
        minSdk 26
        targetSdk 35
        versionCode 152
        versionName '152.0-personal'
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'

    // Align Kotlin runtime modules pulled transitively by AndroidX. Without
    // this, older jdk7/jdk8 split jars duplicate classes now in stdlib.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}
