name: Build LabelOnZeWay Personal APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'labelonzeway-android/**'
      - '.github/workflows/build-labelonzeway-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build personal APK
        working-directory: labelonzeway-android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp labelonzeway-android/app/build/outputs/apk/debug/app-debug.apk LabelOnZeWay-v152-Personal.apk

      - name: Publish APK for download
        uses: actions/upload-artifact@v4
        with:
          name: LabelOnZeWay-v152-Personal-APK
          path: LabelOnZeWay-v152-Personal.apk
          if-no-files-found: error
          retention-days: 30
