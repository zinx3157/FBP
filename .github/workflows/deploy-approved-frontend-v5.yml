name: Deploy Approved LabelOnZeWay Frontend V5
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/deploy-approved-frontend-v5.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Implement approved Mac + mobile frontend
        run: |
          cat > /tmp/v5.py <<'PY'
          from pathlib import Path
          paths=[Path('labelonzeway/index.html'),Path('labelonzeway-android/app/src/main/assets/labelonzeway/index.html')]
          css=r'''<style id="lz-approved-v5">/* LZ_APPROVED_FRONTEND_V5 */
          :root{--v5:#08c7c0;--v5ink:#071722;--v5panel:#0b202b;--v5line:#1e414b}
          .v5-shell{display:none}.v5-side button,.v5-mobile-nav button{font-family:var(--body)}
          @media(min-width:901px){body{padding-left:194px!important;background:#06131c!important;color:#e9f7f6!important}#top{background:#071923!important;border-bottom:1px solid #173b45!important}.v5-shell.v5-desktop{display:block;position:fixed;left:0;top:0;bottom:0;width:194px;z-index:95;background:#06151e;border-right:1px solid #183b45;padding:18px 12px}.v5-brand{font-weight:900;font-size:16px;color:white;padding:4px 8px 18px}.v5-brand b{color:var(--v5)}.v5-side{display:grid;gap:4px}.v5-side button{border:0;background:transparent;color:#a8bbbd;text-align:left;padding:10px;border-radius:8px;font-weight:700;cursor:pointer}.v5-side button:hover,.v5-side button.active{background:#0c8990;color:white}.v5-status{position:absolute;bottom:18px;left:12px;right:12px;border-top:1px solid #183b45;padding-top:12px;font:700 9px var(--mono);color:#6f9295}#app{max-width:1500px!important;grid-template-columns:minmax(350px,.85fr) minmax(430px,1.2fr) minmax(270px,.65fr)!important;gap:12px!important;padding:18px!important}.card{background:#0b202b!important;color:#eaf7f6!important;border:1px solid #1e414b!important;box-shadow:0 10px 28px #0004!important;border-radius:11px!important}.card input,.card select,.card textarea{background:#071923!important;color:#eaf7f6!important;border-color:#31545d!important}.card-head{border-bottom:1px solid #173b45;padding-bottom:9px}.card-head h2:before{background:var(--v5)!important;border:0!important}.card-head .hint,label.f{color:#89a7aa!important}#card-manifest{grid-column:1/-1!important;order:-10!important;border-color:#25656a!important}#card-batch{grid-column:1/-1!important}.btn.orange,.btn.blue,.btn.green{background:var(--v5)!important;color:#041416!important;border-color:#5ee6df!important;box-shadow:none!important}.v5-mobile-nav{display:none!important}}
          @media(max-width:900px){html,body{overflow-x:hidden!important;background:#f4f7f7!important;color:#102536!important;padding-bottom:78px!important}#top{background:#fbfdfd!important;color:#102536!important;border-bottom:1px solid #d8e5e5!important;padding:10px 12px!important}.brand .logo{background:var(--v5)!important}.brand h1{font-size:17px!important}.brand small{font-size:8px!important}.chips{width:100%;margin:0!important}.chip{background:#eef5f5!important;color:#29454b!important;border-color:#d6e5e5!important}.v5-desktop{display:none!important}#app{display:block!important;padding:10px!important}.card{background:#fff!important;color:#102536!important;border:1px solid #dbe6e6!important;border-radius:13px!important;box-shadow:0 4px 15px #10253612!important;margin-bottom:10px!important;padding:13px!important}.card-head h2:before{background:var(--v5)!important;border:0!important}.row2,.b-grid,.batch-primary-actions{grid-template-columns:1fr!important}button,.btn,.btn-ghost,.mini-btn,input,select,textarea{min-height:44px!important}input,select,textarea{font-size:16px!important}.table-wrap,.manifest-table-wrap{overflow-x:auto!important;max-width:100%!important}.v5-mobile-nav{display:grid!important;position:fixed;z-index:120;left:7px;right:7px;bottom:calc(6px + env(safe-area-inset-bottom));grid-template-columns:repeat(5,1fr);padding:5px;background:#fff;border:1px solid #d4e3e3;border-radius:15px;box-shadow:0 10px 30px #10253625}.v5-mobile-nav button{border:0;background:transparent;color:#64797b;border-radius:10px;min-height:52px!important;font-size:9px;font-weight:800}.v5-mobile-nav button b{display:block;font-size:18px;color:#0b8f8a}.v5-mobile-nav button.active{background:#e4f8f6;color:#087d78}body.v5-focus #app>.card{display:none!important}body.v5-focus #app>.card.v5-show{display:block!important}}
          </style>'''
          js=r'''<script id="lz-approved-v5-js">/* LZ_APPROVED_FRONTEND_V5_NAV */
          (function(){function cards(){return [...document.querySelectorAll('#app>.card')]}function text(c){var h=c.querySelector('.card-head h2');return ((c.id||'')+' '+(h?h.textContent:'')).toLowerCase()}var map={home:['manifest','operations','stats'],label:['label','parcel','customer','photo'],manifest:['manifest','batch'],tracking:['tracking'],more:['address','archive','recon','setting','profile','cloud','diagnostic']};function find(n){var a=cards().filter(c=>(map[n]||[]).some(w=>text(c).includes(w)));if(!a.length&&n==='home')a=cards().slice(0,2);if(!a.length&&n==='label')a=cards().slice(0,3);if(!a.length&&n==='more')a=cards().slice(-4);return a}function modal(id,fn){var m=document.getElementById(id);if(m)m.classList.add('open');if(fn&&typeof window[fn]==='function')try{window[fn]()}catch(e){}}function go(n){document.querySelectorAll('[data-v5]').forEach(b=>b.classList.toggle('active',b.dataset.v5===n));if(n==='tracking'){modal('m-tracking-view','renderTrackingView');return}var mobile=matchMedia('(max-width:900px)').matches;if(mobile){document.body.classList.add('v5-focus');cards().forEach(c=>c.classList.remove('v5-show'));find(n).forEach(c=>c.classList.add('v5-show'));scrollTo(0,0)}else{var t=find(n)[0];if(t)t.scrollIntoView({behavior:'smooth',block:'start'})}}function B(n,l,i){var b=document.createElement('button');b.type='button';b.dataset.v5=n;b.innerHTML=i+' '+l;b.onclick=()=>go(n);return b}function build(){if(document.querySelector('.v5-desktop'))return;var s=document.createElement('aside');s.className='v5-shell v5-desktop';s.innerHTML='<div class="v5-brand">LZ &nbsp; LabelOn<b>ZeWay</b><small style="display:block;color:#78979a;font-size:8px">SHIP · TRACK · DELIVER</small></div><div class="v5-side"></div><div class="v5-status">PRODUCTION V2.0.1<br>OPERATIONS COMMAND</div>';var d=s.querySelector('.v5-side');[['home','Operations','⌂'],['label','New Label','＋'],['manifest','Manifest','▤'],['tracking','Tracking','⌖'],['more','Customers / Archive / Tools','•••']].forEach(x=>d.appendChild(B(...x)));document.body.appendChild(s);var m=document.createElement('nav');m.className='v5-mobile-nav';[['home','Home','<b>⌂</b>'],['label','New Label','<b>＋</b>'],['manifest','Manifest','<b>▤</b>'],['tracking','Tracking','<b>⌖</b>'],['more','More','<b>•••</b>']].forEach(x=>m.appendChild(B(...x)));document.body.appendChild(m);go(matchMedia('(max-width:900px)').matches?'home':'manifest')}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build);else build();addEventListener('resize',()=>go(matchMedia('(max-width:900px)').matches?'home':'manifest'))})();</script>'''
          for p in paths:
            s=p.read_text()
            if 'LZ_APPROVED_FRONTEND_V5' not in s:
              s=s.replace('</head>',css+'\n</head>',1).replace('</body>',js+'\n</body>',1)
              p.write_text(s)
          for p in [Path('labelonzeway/service-worker.js'),Path('labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js')]:
            s=p.read_text().replace('labelonzeway-v2.0.1-operations-v4-20260907','labelonzeway-v2.0.1-approved-v5-20260907');p.write_text(s)
          PY
          python3 /tmp/v5.py
      - name: Preserve logic and parity
        run: |
          grep -q LZ_APPROVED_FRONTEND_V5 labelonzeway/index.html
          grep -q LZ_REMOTE_AUTHORITATIVE_NO_RECAPTURE_V1 labelonzeway/cloud-sync.js
          grep -q LZ_SINGLE_MANIFEST_STORE_V1 labelonzeway/cloud-sync.js
          grep -q LZ_CANONICAL_PROFILE_SYNC_V1 labelonzeway/cloud-sync.js
          grep -q LZ_FINAL_MANUAL_LOGIN_LOG_V1 labelonzeway/cloud-sync.js
          cmp labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/index.html
          cmp labelonzeway/cloud-sync.js labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js
          cmp labelonzeway/service-worker.js labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js
          node --check labelonzeway/cloud-sync.js
      - name: Responsive browser regression
        run: |
          npm -g install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8099 >/tmp/http.log 2>&1 &
          cat >/tmp/t.js <<'JS'
          const {chromium}=require('playwright');(async()=>{let b=await chromium.launch({headless:true});for(let [n,w,h] of [['mac',1440,900],['iphone',390,844],['android',412,915]]){let p=await b.newPage({viewport:{width:w,height:h}}),errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto('http://127.0.0.1:8099/labelonzeway/',{waitUntil:'domcontentloaded'});await p.waitForTimeout(700);let r=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth+2,nav:document.querySelectorAll('[data-v5]').length,marker:!!document.querySelector('#lz-approved-v5')}));console.log(n,r,errs);if(r.overflow||r.nav<5||!r.marker)process.exit(2);await p.close()}await b.close()})()
          JS
          NODE_PATH=$(npm root -g) node /tmp/t.js
      - name: Android compile
        working-directory: labelonzeway-android
        run: gradle --no-daemon assembleDebug
      - name: Commit approved frontend
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labelonzeway/index.html labelonzeway/service-worker.js labelonzeway-android/app/src/main/assets/labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js
          git commit -m 'Deploy approved Operations Command and mobile Dispatch frontend'
          git push origin main
