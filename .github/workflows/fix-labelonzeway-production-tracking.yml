name: LabelOnZeWay Production Tracking Repair

on:
  push:
    paths:
      - '.github/workflows/fix-labelonzeway-production-tracking.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply production tracking repair
        run: python3 .github/scripts/fix_labelonzeway_production_tracking.py
      - name: Verify repair
        run: |
          grep -q 'LZ_PRODUCTION_TRACKING_VIEW_V1' labelonzeway/index.html
          grep -q 'trackingCloudReady' labelonzeway/index.html
          grep -q '/rest/v1/rpc/get_public_tracking' labelonzeway/tracking/index.html
          grep -q 'production-tracking-20260906-1' labelonzeway/service-worker.js
          cmp labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/index.html
          cmp labelonzeway/tracking/index.html labelonzeway-android/app/src/main/assets/labelonzeway/tracking/index.html
      - name: Commit production runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labelonzeway labelonzeway-android/app/src/main/assets/labelonzeway LABELONZEWAY-PRODUCTION-TRACKING-AUDIT.md
          git commit -m 'Fix production tracking across LabelOnZeWay platforms' || true
          git push
