name: Restore LabelOnZeWay Operations Deck UI
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/restore-operations-deck-ui.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Restore approved Operations Deck and repair customer names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets=[
            Path('labelonzeway/index.html'),
            Path('labelonzeway-android/app/src/main/assets/labelonzeway/index.html')
          ]
          for p in targets:
              s=p.read_text()
              # The synthetic V6 dashboard/rail hid the richer production Operations Deck.
              s,n1=re.subn(r'\n?<style id="lz-command-v6">.*?</style>\n?', '\n', s, count=1, flags=re.S)
              s,n2=re.subn(r'\n?<script id="lz-command-v6-js">.*?</script>\n?', '\n', s, count=1, flags=re.S)
              # This offset existed only for the removed V6 fixed rail.
              s,_=re.subn(r'\n?<style id="lz-v6-modal-overlap-fix">.*?</style>\n?', '\n', s, count=1, flags=re.S)
              if n1 != 1 or n2 != 1:
                  raise SystemExit(f'{p}: expected one V6 style/script, got style={n1}, script={n2}')
              # Required markers from the approved richer Operations Deck must remain.
              for marker in ('ops-home-title','ops-recent-list','Ready to dispatch.'):
                  if marker not in s:
                      raise SystemExit(f'{p}: missing approved Operations Deck marker {marker}')
              p.write_text(s)

          # Repair the V6 generator's customer lookup as a safeguard if that workflow is ever run again.
          wf=Path('.github/workflows/deploy-command-dispatch-v6.yml')
          w=wf.read_text()
          old="name=String(r.name||r.customer||r.recipient||'Customer')"
          new="name=String((r.rec&&r.rec.name)||r.name||r.customer||r.recipient||'—')"
          if old in w:
              w=w.replace(old,new,1)
          elif new not in w:
              raise SystemExit('V6 generator customer-name anchor not found')
          # Also harden the dashboard metric source against an undeclared global fallback.
          w=w.replace("window.state?.manifest||state?.manifest||[]","window.state?.manifest||[]")
          wf.write_text(w)

          # Force installed/PWA clients to fetch the restored UI instead of keeping the V6 shell cached.
          for p in [Path('labelonzeway/service-worker.js'),Path('labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js')]:
              s=p.read_text()
              s=re.sub(r"const CACHE = '[^']+';", "const CACHE = 'labelonzeway-v2.0.1-opsdeck-restored-20260908';", s, count=1)
              p.write_text(s)
          PY
      - name: Validate every inline JavaScript block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for p in [Path('labelonzeway/index.html'),Path('labelonzeway-android/app/src/main/assets/labelonzeway/index.html')]:
              text=p.read_text()
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S|re.I)
              if not scripts: raise SystemExit(f'{p}: no inline scripts found')
              for i,src in enumerate(scripts,1):
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                      f.write(src); name=f.name
                  r=subprocess.run(['node','--check',name],capture_output=True,text=True)
                  if r.returncode:
                      raise SystemExit(f'{p} inline script {i} failed syntax check:\n{r.stderr}')
          PY
      - name: Verify web Android parity and production logic
        run: |
          cmp labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/index.html
          cmp labelonzeway/service-worker.js labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js
          grep -q 'LZ_REMOTE_AUTHORITATIVE_NO_RECAPTURE_V1' labelonzeway/cloud-sync.js
          grep -q 'LZ_SINGLE_MANIFEST_STORE_V1' labelonzeway/cloud-sync.js
          grep -q 'LZ_CANONICAL_PROFILE_SYNC_V1' labelonzeway/cloud-sync.js
          grep -q 'LZ_FINAL_MANUAL_LOGIN_LOG_V1' labelonzeway/cloud-sync.js
      - name: Commit restored production UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labelonzeway/index.html labelonzeway/service-worker.js \
                  labelonzeway-android/app/src/main/assets/labelonzeway/index.html \
                  labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js \
                  .github/workflows/deploy-command-dispatch-v6.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Restore approved Operations Deck UI and repair customer names'
          git push
