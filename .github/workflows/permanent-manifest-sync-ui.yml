name: LabelOnZeWay permanent manifest sync UI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-production-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify production markers and parity
        run: |
          node --check labelonzeway/cloud-sync.js
          grep -q 'LZ_SINGLE_MANIFEST_STORE_V1' labelonzeway/cloud-sync.js
          grep -q 'LZ_MANIFEST_RECONCILE_LISTENER_V1' labelonzeway/index.html
          grep -q 'LZ_DESKTOP_MODAL_SHELL_V1' labelonzeway/index.html
          grep -q 'LZ_TRACKING_BACK_NAV_V2' labelonzeway/index.html
          cmp labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/index.html
          cmp labelonzeway/cloud-sync.js labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js
      - name: Compile Android proof
        working-directory: labelonzeway-android
        run: gradle --no-daemon clean assembleDebug
