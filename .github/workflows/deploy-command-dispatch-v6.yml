name: Deploy LabelOnZeWay Command Dispatch V6
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/deploy-command-dispatch-v6.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Build real desktop command center and mobile dispatch dashboard
        run: |
          cat > /tmp/v6.py <<'PY'
          from pathlib import Path
          paths=[Path('labelonzeway/index.html'),Path('labelonzeway-android/app/src/main/assets/labelonzeway/index.html')]
          css=r'''<style id="lz-command-v6">/* LZ_COMMAND_DISPATCH_V6 */
          :root{--v6-teal:#18d4ca;--v6-navy:#07141d;--v6-panel:#0c202a;--v6-line:#193945;--v6-muted:#78939b;--v6-light:#f5f7f7;--v6-ink:#102532}
          .v6-desktop,.v6-mobile{display:none}.v6-hidden{display:none!important}
          @media(min-width:901px){body{background:var(--v6-navy)!important;color:#e9f5f4!important;padding-left:222px!important}#top,#mobile-nav,#mobile-context,.v5-shell,.v5-mobile-nav{display:none!important}.v6-desktop{display:block}.v6-rail{position:fixed;inset:0 auto 0 0;width:222px;background:#06121a;border-right:1px solid var(--v6-line);z-index:150;padding:22px 14px}.v6-logo{font:900 18px var(--body);padding:0 10px 24px}.v6-logo b{color:var(--v6-teal)}.v6-rail nav{display:grid;gap:3px}.v6-rail button{border:0;background:transparent;color:#9bb0b5;text-align:left;padding:11px 12px;border-radius:8px;font:700 12px var(--body);cursor:pointer}.v6-rail button:hover,.v6-rail button.active{background:#0d343d;color:#fff}.v6-rail .v6-bottom{position:absolute;bottom:18px;left:14px;right:14px;border-top:1px solid var(--v6-line);padding-top:12px;color:#66868d;font:700 9px var(--mono)}.v6-dashboard{padding:28px 30px;max-width:1600px;margin:auto}.v6-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.v6-title h1{margin:0;font:800 25px var(--body);color:#fff}.v6-title p{margin:5px 0 0;color:var(--v6-muted);font:500 11px var(--body)}.v6-new{border:0;border-radius:8px;background:var(--v6-teal);color:#04201f;padding:11px 17px;font-weight:900;cursor:pointer}.v6-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.v6-metric,.v6-box{background:var(--v6-panel);border:1px solid var(--v6-line);border-radius:11px}.v6-metric{padding:16px}.v6-metric small{display:block;color:#79949b;font:700 9px var(--body);text-transform:uppercase;letter-spacing:.7px}.v6-metric b{display:block;color:#fff;font:800 24px var(--mono);margin-top:8px}.v6-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}.v6-box{padding:16px}.v6-boxhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.v6-boxhead b{font:800 13px var(--body);color:#fff}.v6-tabs{display:flex;gap:5px}.v6-tabs span{padding:5px 8px;border-radius:6px;background:#102a34;color:#8ea6ab;font:700 9px var(--body)}.v6-list{display:grid;gap:6px}.v6-row{display:grid;grid-template-columns:90px 1fr 100px 105px 80px;gap:8px;align-items:center;border-top:1px solid #17333d;padding:10px 4px;font:600 10px var(--body);color:#bfd0d2}.v6-row strong{font-family:var(--mono);color:#fff}.v6-pill{display:inline-block;padding:4px 7px;border-radius:99px;background:#113a3a;color:#5de6dc;font-size:8px}.v6-empty{padding:30px;text-align:center;color:#6f8b91}.v6-actions{display:grid;gap:8px}.v6-actions button{min-height:42px;border:1px solid #244852;border-radius:8px;background:#0a1a23;color:#d7e7e7;text-align:left;padding:0 12px;font:700 10px var(--body);cursor:pointer}.v6-sync{margin-top:14px;padding-top:13px;border-top:1px solid #17333d;font:600 9px var(--body);color:#77959a}.v6-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--v6-teal);margin-right:6px}body.v6-work #v6-dashboard{display:none!important}body.v6-work #app{display:grid!important;padding:20px!important;max-width:1500px!important;margin:auto!important}body:not(.v6-work) #app{display:none!important}#app>.card{background:var(--v6-panel)!important;color:#e7f3f2!important;border:1px solid var(--v6-line)!important;box-shadow:none!important}.card input,.card select,.card textarea{background:#071923!important;color:#eaf7f6!important;border-color:#31545d!important}}
          @media(max-width:900px){body{background:var(--v6-light)!important;color:var(--v6-ink)!important;padding:0 0 78px!important;overflow-x:hidden!important}#top,#mobile-nav,#mobile-context,.v5-shell,.v5-mobile-nav{display:none!important}.v6-mobile{display:block}.v6-mobile-home{padding:18px 14px 10px}.v6-mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.v6-mlogo{font:900 17px var(--body)}.v6-mlogo b{color:#079a93}.v6-avatar{width:34px;height:34px;border-radius:50%;background:#dfe9e8;display:grid;place-items:center;font-weight:900}.v6-hero{background:#0b2731;border-radius:16px;padding:18px;color:#fff;margin-bottom:13px}.v6-hero small{color:#82a2a6;font:700 9px var(--body)}.v6-hero h1{font:800 22px var(--body);margin:5px 0 14px}.v6-hero button{width:100%;min-height:48px;border:0;border-radius:10px;background:var(--v6-teal);font-weight:900;color:#05201f}.v6-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:17px}.v6-quick button{min-width:0;min-height:67px;border:1px solid #dce6e5;background:#fff;border-radius:11px;color:#17323b;font:800 9px var(--body)}.v6-quick b{display:block;color:#079a93;font-size:18px;margin-bottom:5px}.v6-section{font:800 12px var(--body);margin:0 2px 9px}.v6-mmetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:17px}.v6-mm{background:#fff;border:1px solid #dce6e5;border-radius:11px;padding:12px}.v6-mm small{display:block;color:#71868a;font:700 8px var(--body)}.v6-mm b{display:block;margin-top:5px;font:800 18px var(--mono)}.v6-recent{background:#fff;border:1px solid #dce6e5;border-radius:12px;padding:12px}.v6-mrow{display:grid;grid-template-columns:72px 1fr auto;gap:7px;padding:10px 2px;border-top:1px solid #edf1f1;font:600 9px var(--body)}.v6-mrow strong{font-family:var(--mono)}.v6-bottomnav{position:fixed;z-index:160;left:7px;right:7px;bottom:calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid #d7e3e2;border-radius:15px;padding:5px;box-shadow:0 8px 28px #10253620}.v6-bottomnav button{border:0;background:transparent;min-height:52px;border-radius:10px;color:#647b7e;font:800 9px var(--body)}.v6-bottomnav button b{display:block;font-size:17px;color:#0a928c;margin-bottom:2px}.v6-bottomnav button.active{background:#e6f7f5;color:#087b76}body.v6-work #v6-mobile-home{display:none!important}body.v6-work #app{display:block!important;padding:10px!important}body:not(.v6-work) #app{display:none!important}#app>.card{background:#fff!important;color:var(--v6-ink)!important;border:1px solid #dce6e5!important;border-radius:13px!important;box-shadow:none!important;margin-bottom:10px!important}button,.btn,.btn-ghost,.mini-btn,input,select,textarea{min-height:44px!important}input,select,textarea{font-size:16px!important}.row2,.b-grid,.batch-primary-actions{grid-template-columns:1fr!important}.table-wrap,.manifest-table-wrap{max-width:100%!important;overflow-x:auto!important}}
          </style>'''
          js=r'''<script id="lz-command-v6-js">/* LZ_COMMAND_DISPATCH_V6_RUNTIME */
          (function(){const A=(act,arg,label)=>`<button type="button" data-act="${act}"${arg?` data-arg="${arg}"`:''}>${label}</button>`;function rows(m,mobile){let a=(m||[]).slice(-6).reverse();if(!a.length)return '<div class="v6-empty">No active parcels yet.</div>';return a.map(r=>{let id=String(r.oid||r.pick||'—'),name=String(r.name||r.customer||r.recipient||'Customer'),st=String(r.deliveryStatus||r.status||'ready').replaceAll('_',' '),cod=Number(r.cod||0)+Number(r.ship||0);return mobile?`<div class="v6-mrow"><strong>${id}</strong><span>${name}</span><span>${st}</span></div>`:`<div class="v6-row"><strong>${id}</strong><span>${name}</span><span>${st}</span><span>${cod.toLocaleString()} Ar</span><span class="v6-pill">${st}</span></div>`}).join('')}
          function metrics(){try{let m=window.state?.manifest||state?.manifest||[],open=m.filter(r=>!r.done),del=m.filter(r=>r.done||r.deliveryStatus==='delivered'),trans=m.filter(r=>r.deliveryStatus==='in_transit'),cod=open.reduce((s,r)=>s+Number(r.cod||0)+Number(r.ship||0),0);[['v6-total',m.length],['v6-transit',trans.length],['v6-delivered',del.length],['v6-cod',cod.toLocaleString()+' Ar'],['v6-mtotal',m.length],['v6-mtransit',trans.length],['v6-mdelivered',del.length]].forEach(x=>{let e=document.getElementById(x[0]);if(e)e.textContent=x[1]});let d=document.getElementById('v6-live');if(d)d.innerHTML=rows(m,false);let q=document.getElementById('v6-recent');if(q)q.innerHTML=rows(m,true)}catch(e){}}
          function work(view){document.body.classList.add('v6-work');document.querySelectorAll('#app>.card').forEach(c=>c.classList.add('v6-hidden'));let ids={label:['card-parcel'],manifest:['card-manifest','card-batch'],more:['card-more'],home:[]}[view]||[];ids.forEach(id=>document.getElementById(id)?.classList.remove('v6-hidden'));if(view==='tracking'){document.querySelector('[data-act="openTrackingDashboard"]')?.click()}if(view==='customers'){document.querySelector('[data-act="openAddressBook"]')?.click()}if(view==='archive'){document.querySelector('[data-act="openArch"]')?.click()}if(view==='settings'){document.querySelector('[data-act="openSettings"]')?.click()}scrollTo(0,0)}function home(){document.body.classList.remove('v6-work');metrics();scrollTo(0,0)}
          function build(){document.querySelectorAll('#lz-approved-v5,#lz-approved-v5-js,.v5-shell,.v5-mobile-nav').forEach(e=>e.remove());let rail=document.createElement('aside');rail.className='v6-desktop v6-rail';rail.innerHTML='<div class="v6-logo">LZ · LabelOn<b>ZeWay</b></div><nav id="v6-railnav"></nav><div class="v6-bottom">PRODUCTION V2.0.1<br><span class="v6-dot"></span>OPERATIONS ONLINE</div>';document.body.appendChild(rail);let nav=rail.querySelector('nav');[['home','⌂  Operations'],['label','＋  New Label'],['manifest','▤  Manifest'],['tracking','⌖  Tracking'],['archive','▣  Archive'],['customers','♙  Customers'],['more','◫  Analytics / Claims'],['settings','⚙  Printer / Cloud / Settings']].forEach(x=>{let b=document.createElement('button');b.textContent=x[1];b.onclick=()=>x[0]==='home'?home():work(x[0]);nav.appendChild(b)});
          let dash=document.createElement('section');dash.id='v6-dashboard';dash.className='v6-desktop v6-dashboard';dash.innerHTML=`<div class="v6-topline"><div class="v6-title"><h1>Operations Dashboard</h1><p>Live command center · labels · dispatch · delivery</p></div>${A('startNewLabel','', '＋ NEW LABEL')}</div><div class="v6-metrics"><div class="v6-metric"><small>Active parcels</small><b id="v6-total">0</b></div><div class="v6-metric"><small>In transit</small><b id="v6-transit">0</b></div><div class="v6-metric"><small>Delivered</small><b id="v6-delivered">0</b></div><div class="v6-metric"><small>COD due</small><b id="v6-cod">0 Ar</b></div></div><div class="v6-grid"><div class="v6-box"><div class="v6-boxhead"><b>LIVE MANIFEST</b><div class="v6-tabs"><span>ALL</span><span>READY</span><span>IN TRANSIT</span></div></div><div id="v6-live" class="v6-list"></div></div><aside class="v6-box"><div class="v6-boxhead"><b>QUICK ACTIONS</b></div><div class="v6-actions">${A('startNewLabel','', '＋ Create new label')}${A('openTrackingDashboard','', '⌖ Open tracking')}${A('openAddressBook','', '♙ Customers')}${A('openArch','', '▣ Archive & reports')}${A('printManifest','', '▤ Print manifest')}${A('openSettings','', '⚙ Settings')}</div><div class="v6-sync"><span class="v6-dot"></span>SYNC STATUS · ONLINE<br><br>Shared production workspace active</div></aside></div>`;document.body.appendChild(dash);
          let mob=document.createElement('section');mob.id='v6-mobile-home';mob.className='v6-mobile v6-mobile-home';mob.innerHTML=`<div class="v6-mhead"><div class="v6-mlogo">LabelOn<b>ZeWay</b></div><div class="v6-avatar">LZ</div></div><div class="v6-hero"><small>DISPATCH WORKSPACE</small><h1>Ready to ship?</h1>${A('startNewLabel','', '＋ CREATE NEW LABEL')}</div><div class="v6-quick"><button data-v6="manifest"><b>▤</b>Manifest</button><button data-v6="tracking"><b>⌖</b>Tracking</button><button data-v6="customers"><b>♙</b>Customers</button>${A('showMobileView','batch','<b>▦</b>Scan')}</div><div class="v6-section">TODAY’S ACTIVITY</div><div class="v6-mmetrics"><div class="v6-mm"><small>PARCELS</small><b id="v6-mtotal">0</b></div><div class="v6-mm"><small>IN TRANSIT</small><b id="v6-mtransit">0</b></div><div class="v6-mm"><small>DELIVERED</small><b id="v6-mdelivered">0</b></div></div><div class="v6-section">RECENT PARCELS</div><div id="v6-recent" class="v6-recent"></div>`;document.body.appendChild(mob);let bn=document.createElement('nav');bn.className='v6-mobile v6-bottomnav';[['home','⌂','Home'],['label','＋','Label'],['manifest','▤','Manifest'],['tracking','⌖','Tracking'],['more','•••','More']].forEach(x=>{let b=document.createElement('button');b.innerHTML=`<b>${x[1]}</b>${x[2]}`;b.onclick=()=>{bn.querySelectorAll('button').forEach(z=>z.classList.remove('active'));b.classList.add('active');x[0]==='home'?home():work(x[0])};bn.appendChild(b)});document.body.appendChild(bn);mob.querySelectorAll('[data-v6]').forEach(b=>b.onclick=()=>work(b.dataset.v6));home();metrics();setInterval(metrics,1500);addEventListener('lz:manifest-updated',metrics)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build);else build()})();
          </script>'''
          for p in paths:
            s=p.read_text()
            import re
            s=re.sub(r'<style id="lz-approved-v5">.*?</style>\s*','',s,flags=re.S)
            s=re.sub(r'<script id="lz-approved-v5-js">.*?</script>\s*','',s,flags=re.S)
            s=re.sub(r'<style id="lz-command-v6">.*?</style>\s*','',s,flags=re.S)
            s=re.sub(r'<script id="lz-command-v6-js">.*?</script>\s*','',s,flags=re.S)
            s=s.replace('</head>',css+'\n</head>',1).replace('</body>',js+'\n</body>',1)
            p.write_text(s)
          for p in [Path('labelonzeway/service-worker.js'),Path('labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js')]:
            s=p.read_text();s=re.sub(r"const CACHE = '[^']+'","const CACHE = 'labelonzeway-v2.0.1-command-v6-20260907'",s,1);p.write_text(s)
          PY
          python3 /tmp/v6.py
      - name: Verify production logic and web Android parity
        run: |
          grep -q LZ_COMMAND_DISPATCH_V6 labelonzeway/index.html
          grep -q LZ_REMOTE_AUTHORITATIVE_NO_RECAPTURE_V1 labelonzeway/cloud-sync.js
          grep -q LZ_SINGLE_MANIFEST_STORE_V1 labelonzeway/cloud-sync.js
          grep -q LZ_CANONICAL_PROFILE_SYNC_V1 labelonzeway/cloud-sync.js
          grep -q LZ_FINAL_MANUAL_LOGIN_LOG_V1 labelonzeway/cloud-sync.js
          cmp labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/index.html
          cmp labelonzeway/cloud-sync.js labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js
          node --check labelonzeway/cloud-sync.js
      - name: Responsive and overlap regression
        run: |
          npm -g install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8099 >/tmp/http.log 2>&1 &
          cat >/tmp/v6test.js <<'JS'
          const {chromium}=require('playwright');(async()=>{let b=await chromium.launch({headless:true});for(let [n,w,h] of [['mac',1440,900],['iphone',390,844],['android',412,915]]){let p=await b.newPage({viewport:{width:w,height:h}}),errs=[];p.on('pageerror',e=>errs.push(String(e)));await p.goto('http://127.0.0.1:8099/labelonzeway/',{waitUntil:'domcontentloaded'});await p.waitForTimeout(1000);let r=await p.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth+2,marker:!!document.querySelector('#lz-command-v6'),desk:innerWidth>900?!!document.querySelector('#v6-dashboard'):true,mobile:innerWidth<=900?!!document.querySelector('#v6-mobile-home'):true,nav:innerWidth<=900?document.querySelectorAll('.v6-bottomnav button').length:document.querySelectorAll('.v6-rail button').length}));console.log(n,r,errs);if(r.overflow||!r.marker||!r.desk||!r.mobile||r.nav<5||errs.length)process.exit(2);await p.close()}await b.close()})()
          JS
          NODE_PATH=$(npm root -g) node /tmp/v6test.js
      - name: Android compile
        working-directory: labelonzeway-android
        run: gradle --no-daemon assembleDebug
      - name: Commit production V6
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labelonzeway/index.html labelonzeway/service-worker.js labelonzeway-android/app/src/main/assets/labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js
          git commit -m 'Deploy real Operations Command and mobile Dispatch V6'
          git push origin main