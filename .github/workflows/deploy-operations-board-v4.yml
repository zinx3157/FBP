name: Deploy LabelOnZeWay Operations Board V4
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-operations-board-v4.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply full responsive shell
        run: |
          cat > /tmp/lz-v4.py <<'PY'
          from pathlib import Path
          files=[Path('labelonzeway/index.html'),Path('labelonzeway-android/app/src/main/assets/labelonzeway/index.html')]
          marker='LZ_OPERATIONS_BOARD_DISPATCH_V4'
          css=r'''<style id="lz-operations-v4">
          /* LZ_OPERATIONS_BOARD_DISPATCH_V4 */
          :root{--cmd:#06131d;--cmd2:#0b1d29;--teal:#08b9b2;--cyan:#39d8d1;--soft:#f3f6f7;--mobileInk:#102337}
          .lz-command-rail,.lz-mobile-nav{font-family:var(--body)}
          @media(min-width:901px){
            body{padding-left:176px!important;background:radial-gradient(circle at 80% 0,#123242 0,transparent 34%),linear-gradient(145deg,#06131d,#0a1b27 55%,#07131d)!important;color:#e8f5f3!important}
            #top{position:sticky;top:0;z-index:60;background:rgba(5,17,26,.96)!important;border-bottom:1px solid #1d4651!important;backdrop-filter:blur(14px)}
            .hzd{display:none!important} #app{max-width:1600px!important;padding:18px 22px 34px!important;grid-template-columns:minmax(350px,.85fr) minmax(430px,1.15fr) minmax(280px,.65fr)!important;gap:14px!important}
            .card{background:linear-gradient(145deg,#0c1d29,#0a1822)!important;color:#e9f5f3!important;border:1px solid #24444d!important;border-radius:14px!important;box-shadow:0 14px 34px rgba(0,0,0,.24)!important}
            .card-head{border-bottom:1px solid #183a43;padding-bottom:10px}.card-head h2{color:#f4fffd!important}.card-head h2::before{background:var(--teal)!important;border:0!important;border-radius:3px!important;box-shadow:0 0 12px rgba(8,185,178,.45)}
            .card .hint,label.f{color:#89aaa9!important} .card input,.card select,.card textarea{background:#081721!important;color:#e8f5f3!important;border-color:#31515a!important}.card input:focus,.card select:focus,.card textarea:focus{border-color:var(--teal)!important;box-shadow:0 0 0 3px rgba(8,185,178,.15)!important}
            .btn.orange,.btn.blue,.btn.green{background:var(--teal)!important;border-color:#63e0da!important;color:#031416!important;box-shadow:none!important}.btn.dark,.btn:not(.orange):not(.blue):not(.green){box-shadow:none!important;border-color:#35535b!important}
            #card-manifest{grid-column:1/-1!important;order:-5;border-color:#2c666b!important} #card-batch{grid-column:1/-1!important}
            .lz-command-rail{display:flex;position:fixed;z-index:80;left:0;top:0;bottom:0;width:176px;background:#041019;border-right:1px solid #1b414b;padding:18px 12px;flex-direction:column;gap:8px}
            .lz-rail-brand{padding:6px 8px 18px;color:#eafffc;font-weight:900;font-size:16px}.lz-rail-brand b{color:var(--teal)}
            .lz-command-rail button{width:100%;border:0;border-radius:9px;background:transparent;color:#91aaa9;text-align:left;padding:11px 10px;font-weight:800;cursor:pointer}.lz-command-rail button:hover,.lz-command-rail button.active{background:#0d2932;color:#74e8e1}.lz-rail-spacer{flex:1}.lz-rail-state{font:700 9px var(--mono);color:#4d7779;padding:8px}
            .lz-mobile-nav{display:none!important}
          }
          @media(max-width:900px){
            html,body{overflow-x:hidden!important;max-width:100vw!important}body{background:var(--soft)!important;color:var(--mobileInk)!important;padding-bottom:calc(78px + env(safe-area-inset-bottom))!important}
            #top{position:sticky;top:0;z-index:60;background:rgba(248,251,251,.97)!important;color:var(--mobileInk)!important;border-bottom:1px solid #d9e5e5!important;box-shadow:0 5px 18px rgba(16,35,55,.06)!important}.hzd{display:none!important}
            #app{display:block!important;padding:10px 10px 22px!important;width:100%!important}.card{margin:0 0 10px!important;border:1px solid #dce6e7!important;border-radius:14px!important;box-shadow:0 4px 16px rgba(16,35,55,.06)!important;padding:14px!important;background:#fbfdfd!important;color:var(--mobileInk)!important}
            .card-head{margin-bottom:10px!important}.card-head h2{font-size:14px!important}.card-head h2::before{background:var(--teal)!important;border:0!important;border-radius:3px!important}.card-head .hint{font-size:9px!important}
            button,.btn,.btn-ghost,.mini-btn,input,select,textarea{min-height:44px!important}input,select,textarea{font-size:16px!important}.row2,.batch-primary-actions,.b-grid{grid-template-columns:1fr!important}.batch-bar,.batch-options,.rec-toolbar{gap:7px!important}.batch-bar select{width:100%!important;min-width:0!important}
            .table-wrap,.manifest-table-wrap{max-width:100%!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch}.lz-command-rail{display:none!important}
            .lz-mobile-nav{display:grid;position:fixed;z-index:100;left:8px;right:8px;bottom:calc(7px + env(safe-area-inset-bottom));grid-template-columns:repeat(5,1fr);gap:3px;padding:6px;background:rgba(255,255,255,.96);border:1px solid #d4e4e4;border-radius:16px;box-shadow:0 12px 32px rgba(10,35,48,.18);backdrop-filter:blur(14px)}
            .lz-mobile-nav button{border:0;background:transparent;color:#637879;border-radius:11px;padding:5px 2px;min-height:50px!important;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.lz-mobile-nav button span{font-size:18px;line-height:18px}.lz-mobile-nav button.active{background:#e6f8f6;color:#087f7a}
            body.lz-mobile-focus #app>.card{display:none!important}body.lz-mobile-focus #app>.card.lz-mobile-visible{display:block!important}
            .manifest-tools details{width:100%}.action-menu-grid{grid-template-columns:1fr 1fr!important}
          }
          @media(max-width:430px){#top{padding-left:12px!important;padding-right:12px!important}.brand h1{font-size:17px!important}.brand small{display:none!important}.chips{width:100%!important;margin-left:0!important}.chip{font-size:10px!important;padding:5px 7px!important}.action-menu-grid{grid-template-columns:1fr!important}}
          </style>'''
          js=r'''<script id="lz-operations-v4-js">
          /* LZ_OPERATIONS_BOARD_DISPATCH_V4_NAV */
          (function(){
            function cards(){return Array.prototype.slice.call(document.querySelectorAll('#app > .card'))}
            function match(words){var cs=cards();return cs.filter(function(c){var h=c.querySelector('.card-head h2');var t=((c.id||'')+' '+(h?h.textContent:'')).toLowerCase();return words.some(function(w){return t.indexOf(w)>=0})})}
            var groups={home:['manifest','operations','stats'],label:['parcel','label','customer'],manifest:['manifest','batch'],tracking:['tracking'],more:['address','archive','recon','setting','profile','cloud','diagnostic']};
            function targets(name){var a=match(groups[name]||[]);if(name==='home'&&!a.length)a=cards().slice(0,2);if(name==='label'&&!a.length)a=cards().slice(0,3);if(name==='more'&&!a.length)a=cards().slice(-3);return a}
            function activate(name,scroll){var mobile=window.matchMedia('(max-width:900px)').matches;document.querySelectorAll('[data-lz-nav]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-lz-nav')===name)});if(mobile){document.body.classList.add('lz-mobile-focus');cards().forEach(function(c){c.classList.remove('lz-mobile-visible')});targets(name).forEach(function(c){c.classList.add('lz-mobile-visible')});if(scroll)window.scrollTo({top:0,behavior:'smooth'})}else{document.body.classList.remove('lz-mobile-focus');cards().forEach(function(c){c.classList.remove('lz-mobile-visible')});var t=targets(name)[0];if(t&&scroll)t.scrollIntoView({behavior:'smooth',block:'start'})}}
            function btn(name,icon,label){var b=document.createElement('button');b.type='button';b.setAttribute('data-lz-nav',name);b.innerHTML='<span>'+icon+'</span>'+label;b.onclick=function(){activate(name,true)};return b}
            function build(){if(document.querySelector('.lz-mobile-nav'))return;var rail=document.createElement('nav');rail.className='lz-command-rail';rail.setAttribute('aria-label','Operations navigation');rail.innerHTML='<div class="lz-rail-brand">LabelOn<b>ZeWay</b></div>';[['home','⌂','OPERATIONS'],['label','＋','NEW LABEL'],['manifest','▤','MANIFEST'],['tracking','⌖','TRACKING'],['more','•••','TOOLS']].forEach(function(x){rail.appendChild(btn(x[0],x[1],x[2]))});var sp=document.createElement('div');sp.className='lz-rail-spacer';rail.appendChild(sp);var st=document.createElement('div');st.className='lz-rail-state';st.textContent='PRODUCTION · V2.0.1';rail.appendChild(st);document.body.appendChild(rail);var mob=document.createElement('nav');mob.className='lz-mobile-nav';mob.setAttribute('aria-label','Dispatch navigation');[['home','⌂','Home'],['label','＋','Label'],['manifest','▤','Manifest'],['tracking','⌖','Tracking'],['more','•••','More']].forEach(function(x){mob.appendChild(btn(x[0],x[1],x[2]))});document.body.appendChild(mob);activate(window.matchMedia('(max-width:900px)').matches?'home':'manifest',false)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build);else build();
            window.addEventListener('resize',function(){activate(window.matchMedia('(max-width:900px)').matches?'home':'manifest',false)});
          })();
          </script>'''
          for p in files:
            s=p.read_text()
            if marker in s: continue
            s=s.replace('</head>',css+'\n</head>',1)
            s=s.replace('</body>',js+'\n</body>',1)
            p.write_text(s)
          for p in [Path('labelonzeway/service-worker.js'),Path('labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js')]:
            s=p.read_text();s=s.replace('labelonzeway-v2.0.1-design-v3-20260907','labelonzeway-v2.0.1-operations-v4-20260907');p.write_text(s)
          PY
          python3 /tmp/lz-v4.py
      - name: Integrity and parity checks
        run: |
          grep -q 'LZ_OPERATIONS_BOARD_DISPATCH_V4' labelonzeway/index.html
          grep -q 'LZ_REMOTE_AUTHORITATIVE_NO_RECAPTURE_V1' labelonzeway/cloud-sync.js
          grep -q 'LZ_SINGLE_MANIFEST_STORE_V1' labelonzeway/cloud-sync.js
          grep -q 'LZ_MANIFEST_RECONCILE_LISTENER_V1' labelonzeway/index.html
          grep -q 'LZ_CANONICAL_PROFILE_SYNC_V1' labelonzeway/cloud-sync.js
          grep -q 'LZ_FINAL_MANUAL_LOGIN_LOG_V1' labelonzeway/cloud-sync.js
          grep -q "else setTimeout(function(){openCustomerConfirmation(row.id)},350)" labelonzeway/index.html
          cmp labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/index.html
          cmp labelonzeway/cloud-sync.js labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js
          cmp labelonzeway/service-worker.js labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js
          node --check labelonzeway/cloud-sync.js
      - name: Install browser and test responsive shell
        run: |
          npm -g install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          python3 -m http.server 8099 >/tmp/lz-http.log 2>&1 &
          cat > /tmp/test.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});for(const [name,w,h] of [['mac',1440,900],['iphone',390,844],['android',412,915]]){const p=await b.newPage({viewport:{width:w,height:h}});let errors=[];p.on('pageerror',e=>errors.push(String(e)));await p.goto('http://127.0.0.1:8099/labelonzeway/',{waitUntil:'domcontentloaded'});await p.waitForTimeout(1000);const r=await p.evaluate(()=>{const controls=[...document.querySelectorAll('button,input,select,textarea,a')].filter(x=>{const s=getComputedStyle(x),r=x.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0});return {overflow:document.documentElement.scrollWidth>innerWidth+2,nav:document.querySelectorAll('[data-lz-nav]').length,clipped:controls.filter(x=>{let r=x.getBoundingClientRect();return r.right>innerWidth+2||r.left<-2}).length}});if(r.overflow||r.nav<5||r.clipped)throw Error(name+JSON.stringify(r));console.log(name,r,'pageErrors',errors.length);await p.close()}await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH=$(npm root -g) node /tmp/test.js
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android debug proof
        run: |
          cd labelonzeway-android
          gradle --no-daemon assembleDebug
      - name: Commit production V4
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labelonzeway/index.html labelonzeway/service-worker.js labelonzeway-android/app/src/main/assets/labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy full Operations Board and light mobile Dispatch UX'
          git push origin main
