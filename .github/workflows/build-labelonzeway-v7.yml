name: Build LabelOnZeWay V7 Full Redesign
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-labelonzeway-v7.yml']
permissions:
  contents: write
jobs:
  build-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create isolated V7 preview from production engine
        run: |
          rm -rf labelonzeway-v7
          cp -R labelonzeway labelonzeway-v7
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('labelonzeway-v7/index.html')
          s=p.read_text()
          css=r'''
<style id="lz-v7-complete-redesign">
:root{--v7-bg:#eef2f0;--v7-paper:#ffffff;--v7-ink:#15201d;--v7-muted:#6e7975;--v7-line:#d8dfdc;--v7-accent:#ff5c35;--v7-accent-2:#0d5d51;--v7-dark:#12221f;--v7-soft:#f6f8f7;--v7-good:#197861;--v7-warn:#b56a16;--v7-danger:#a93c32;--v7-r:18px}
