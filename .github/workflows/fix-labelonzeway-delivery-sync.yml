name: Fix LabelOnZeWay production delivery sync

on:
  push:
    paths:
      - '.github/scripts/fix_delivery_status_cross_device_sync.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply production repair
        run: python .github/scripts/fix_delivery_status_cross_device_sync.py
      - name: Verify production markers and parity
        run: |
          grep -q 'LZ_DELIVERY_SYNC_COMMIT_V1' labelonzeway/index.html
          grep -q 'syncDeliveryChangeNow' labelonzeway/index.html
          ! grep -q 'openCustomerNotification(r.id,status)' labelonzeway/index.html
          cmp labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/index.html
          cmp labelonzeway/cloud-sync.js labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js
          cmp labelonzeway/service-worker.js labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js
      - name: Compile Android proof build
        working-directory: labelonzeway-android
        run: gradle --no-daemon clean assembleDebug
      - name: Commit repaired production runtime
        run: |
          if git diff --quiet; then
            echo 'Production runtime already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labelonzeway labelonzeway-android/app/src/main/assets/labelonzeway
          git commit -m 'Fix immediate cross-device delivery status synchronization'
          git push
      - name: Upload Android proof APK
        uses: actions/upload-artifact@v4
        with:
          name: LabelOnZeWay-Delivery-Sync-Debug-Proof
          path: labelonzeway-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
