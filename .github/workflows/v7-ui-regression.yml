name: V7 UI Regression Audit
on:
  push:
    branches: [main]
    paths:
      - 'labelonzeway-v7/**'
      - 'labelonzeway/**'
      - 'tests/v7-ui-audit.mjs'
      - 'tests/v7-final-uat-audit.mjs'
      - '.github/workflows/v7-ui-regression.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium and WebKit
        run: |
          npm install --no-save playwright@1.55.0
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          npx playwright install --with-deps chromium webkit
      - name: Start local web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/v7-http.log 2>&1 &
          echo $! > /tmp/v7-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/labelonzeway-v7/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v7-http.log
          exit 1
      - name: Run cross-browser control audit
        run: node tests/v7-ui-audit.mjs
      - name: Run targeted final UAT audit
        run: node tests/v7-final-uat-audit.mjs
      - name: Stop local web server
        if: always()
        run: kill $(cat /tmp/v7-http.pid) 2>/dev/null || true
