name: LabelOnZeWay final tracking close invariant

on:
  push:
    branches:
      - production/final-close-invariant-20260907
    paths:
      - scripts/apply_final_tracking_close.py
      - .github/workflows/final-tracking-close.yml

permissions:
  contents: write

jobs:
  verify-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/final-close-invariant-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply close invariant
        run: python3 scripts/apply_final_tracking_close.py
      - name: Verify runtime
        run: |
          node --check labelonzeway/cloud-sync.js
          grep -q 'LZ_TRACKING_CLOSE_DIRECT_V1' labelonzeway/index.html
          grep -q 'LZ_FINAL_MANUAL_LOGIN_LOG_V1' labelonzeway/cloud-sync.js
          grep -q 'LZ_LOGISTICS_COMMAND_UI_V1' labelonzeway/index.html
          cmp labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/index.html
          cmp labelonzeway/cloud-sync.js labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js
          cmp labelonzeway/service-worker.js labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js
      - name: Compile Android proof
        working-directory: labelonzeway-android
        run: gradle --no-daemon clean assembleDebug
      - name: Commit verified runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labelonzeway/index.html labelonzeway/cloud-sync.js labelonzeway/service-worker.js \
            labelonzeway-android/app/src/main/assets/labelonzeway/index.html \
            labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js \
            labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js
          if git diff --cached --quiet; then echo 'No runtime changes'; else git commit -m 'Make Tracking View close controls deterministic'; git push origin HEAD:production/final-close-invariant-20260907; fi
