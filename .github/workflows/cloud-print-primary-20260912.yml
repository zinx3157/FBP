name: LabelOnZeWay cloud print primary 20260912

on:
  push:
    branches:
      - fix/cloud-print-primary-20260912
    paths:
      - scripts/apply_cloud_print_primary.py
      - .github/workflows/cloud-print-primary-20260912.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/cloud-print-primary-20260912
          fetch-depth: 0

      - name: Apply cloud-first POS80C patch
        run: python3 scripts/apply_cloud_print_primary.py

      - name: Verify cloud auth and print route
        run: |
          node --check labelonzeway/cloud-sync.js
          grep -q 'LZ_CLOUD_PRINT_PRIMARY_V1' labelonzeway/cloud-sync.js
          grep -q 'persistSession: true' labelonzeway/cloud-sync.js
          grep -q 'LZ_HOSTED_CLOUD_PRINT_PRIMARY_V1' labelonzeway/index.html
          grep -q 'Supabase + Render' labelonzeway/index.html
          grep -q 'labelonzeway-v2.0.1-cloud-primary-20260912' labelonzeway/service-worker.js
          cmp labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/index.html
          cmp labelonzeway/cloud-sync.js labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js
          cmp labelonzeway/service-worker.js labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js

      - name: Commit verified runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labelonzeway/index.html labelonzeway/cloud-sync.js labelonzeway/service-worker.js \
            labelonzeway-android/app/src/main/assets/labelonzeway/index.html \
            labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js \
            labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
          else
            git commit -m 'Make hosted POS80C printing cloud-first without Mac bridge'
            git push origin HEAD:fix/cloud-print-primary-20260912
          fi
