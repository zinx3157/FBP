name: Fix LabelOnZeWay Mac tracking sync v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply repair
        run: python .github/scripts/fix_mac_tracking_back_and_sync_v2.py
      - name: Verify JavaScript
        run: node --check labelonzeway/cloud-sync.js
      - name: Verify production markers and parity
        run: |
          grep -q 'LZ_CANONICAL_PROFILE_SYNC_V1' labelonzeway/cloud-sync.js
          grep -q 'LZ_SYNC_WATCHDOG_V2' labelonzeway/cloud-sync.js
          grep -q 'LZ_TRACKING_BACK_NAV_V2' labelonzeway/index.html
          grep -q 'entity.profile_id === syncProfile' labelonzeway/cloud-sync.js
          cmp labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/index.html
          cmp labelonzeway/cloud-sync.js labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js
      - name: Compile Android proof build
        working-directory: labelonzeway-android
        run: gradle --no-daemon clean assembleDebug
      - name: Commit repaired production runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labelonzeway labelonzeway-android/app/src/main/assets/labelonzeway
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Mac tracking navigation and cross-device sync convergence'
            git push origin HEAD:main
          fi
      - name: Upload Android proof APK
        uses: actions/upload-artifact@v4
        with:
          name: LabelOnZeWay-Mac-Tracking-Sync-V2-Debug-Proof
          path: labelonzeway-android/app/build/outputs/apk/debug/*.apk
