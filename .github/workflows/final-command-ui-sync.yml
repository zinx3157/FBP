name: LabelOnZeWay final command UI and sync

on:
  push:
    branches:
      - production/final-command-ui-sync-20260907
    paths:
      - scripts/apply_final_command_ui_sync.py
      - .github/workflows/final-command-ui-sync.yml

permissions:
  contents: write

jobs:
  build-verify-and-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: production/final-command-ui-sync-20260907
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply final production patch
        run: python3 scripts/apply_final_command_ui_sync.py

      - name: Verify JavaScript and production markers
        run: |
          node --check labelonzeway/cloud-sync.js
          grep -q 'LZ_FINAL_MANUAL_LOGIN_LOG_V1' labelonzeway/cloud-sync.js
          grep -q 'persistSession: false' labelonzeway/cloud-sync.js
          grep -q 'LZ_LOGISTICS_COMMAND_UI_V1' labelonzeway/index.html
          grep -q 'LZ_SINGLE_MANIFEST_STORE_V1' labelonzeway/cloud-sync.js
          grep -q 'LZ_CANONICAL_PROFILE_SYNC_V1' labelonzeway/cloud-sync.js
          grep -q 'LZ_TRACKING_BACK_NAV_V2' labelonzeway/index.html
          cmp labelonzeway/index.html labelonzeway-android/app/src/main/assets/labelonzeway/index.html
          cmp labelonzeway/cloud-sync.js labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js
          cmp labelonzeway/service-worker.js labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js

      - name: Compile Android proof
        working-directory: labelonzeway-android
        run: gradle --no-daemon clean assembleDebug

      - name: Commit verified production runtime to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labelonzeway/index.html labelonzeway/cloud-sync.js labelonzeway/service-worker.js \
            labelonzeway-android/app/src/main/assets/labelonzeway/index.html \
            labelonzeway-android/app/src/main/assets/labelonzeway/cloud-sync.js \
            labelonzeway-android/app/src/main/assets/labelonzeway/service-worker.js
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
          else
            git commit -m 'Deploy final command UI with manual cloud login and persistent sync diagnostics'
            git push origin HEAD:production/final-command-ui-sync-20260907
          fi
