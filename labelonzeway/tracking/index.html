<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Track delivery · LabelOnZeWay</title>
  <style>
    :root{color-scheme:light;--navy:#111b25;--blue:#22577a;--orange:#f15a32;--paper:#fff;--bg:#eef1f4;--line:#ccd3d9}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:start center;padding:clamp(20px,8vh,80px) 16px;background:var(--bg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy)}
    main{width:min(620px,100%);background:var(--paper);border:1px solid var(--line);border-top:7px solid var(--orange);border-radius:14px;padding:clamp(22px,5vw,38px);box-shadow:0 12px 32px #17212b18}
    h1{margin:0 0 6px;font-size:1.55rem}h2{margin:20px 0 14px;font-size:1.25rem}.brand{color:var(--blue);font-weight:800;letter-spacing:.04em}.pill{display:inline-block;border:1px solid var(--blue);border-radius:999px;padding:5px 11px;font-weight:700;color:var(--blue)}
    dl{display:grid;grid-template-columns:max-content 1fr;gap:10px 18px;margin:22px 0 0}dt{font-weight:700}dd{margin:0;overflow-wrap:anywhere}form{display:grid;gap:12px;margin-top:20px}label{font-weight:700}input{width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit}button{justify-self:start;padding:11px 18px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:750;font-size:1rem}.error{color:#a32720}.muted{color:#5b6670}output{display:block;margin-top:18px}
    @media(max-width:480px){dl{grid-template-columns:1fr;gap:3px}dd{margin-bottom:8px}}
  </style>
</head>
<body>
<main>
  <div class="brand">LABELONZEWAY</div>
  <h1>Track delivery</h1>
  <p class="muted">Private delivery status supplied through a secure internet tracking token.</p>
  <form id="track" hidden>
    <label>Secure tracking token<input name="token" required autocomplete="off"></label>
    <button>Track parcel</button>
  </form>
  <output id="result" aria-live="polite">Loading tracking status…</output>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  'use strict';
  var result=document.getElementById('result'),form=document.getElementById('track');
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function label(status){return({ready:'Ready for Dispatch',in_transit:'In Transit',delivered:'Delivered',exception:'Exception'})[status]||'Ready for Dispatch'}
  function show(parcel){result.className='';result.innerHTML='<article><h2>Order '+esc(parcel.orderNumber||'—')+'</h2><p class="pill">'+esc(label(parcel.status))+'</p><dl><dt>Milestone</dt><dd>'+esc(parcel.milestone||'—')+'</dd><dt>Delivery process</dt><dd>'+esc(parcel.deliveryProcessDate||'Not scheduled')+'</dd><dt>Last update</dt><dd>'+esc(parcel.lastUpdate||'Not available')+'</dd><dt>Proof of delivery</dt><dd>'+(parcel.podAvailable?'Available':'Not yet available')+'</dd></dl></article>'}
  function configUrl(){return new URL('../sync-config.json',location.href).toString()}
  function load(token){token=String(token||'').trim();if(!token){form.hidden=false;result.textContent='Enter the secure token.';return}if(!/^trk_[A-Za-z0-9_-]{20,}$/.test(token)){form.hidden=false;result.className='error';result.textContent='Invalid tracking token.';return}result.className='';result.textContent='Loading tracking status…';fetch(configUrl(),{cache:'no-store'}).then(function(response){if(!response.ok)throw new Error('Tracking service configuration is unavailable');return response.json()}).then(function(config){if(!window.supabase||!window.supabase.createClient)throw new Error('Secure tracking service did not load');var client=window.supabase.createClient(config.supabaseUrl,config.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});return client.rpc('get_public_tracking',{p_token:token})}).then(function(response){if(response.error)throw response.error;var parcel=Array.isArray(response.data)?response.data[0]:response.data;if(!parcel)throw new Error('Tracking link not found');show({orderNumber:parcel.order_number,status:parcel.status,milestone:parcel.milestone,deliveryProcessDate:parcel.delivery_process_date,lastUpdate:parcel.last_update,podAvailable:parcel.pod_available});form.hidden=true}).catch(function(error){form.hidden=false;result.className='error';result.textContent=String(error&&error.message||error)})}
  form.addEventListener('submit',function(event){event.preventDefault();var token=new FormData(form).get('token');history.replaceState(null,'','?token='+encodeURIComponent(token));load(token)});
  var token=new URLSearchParams(location.search).get('token')||'';form.elements.token.value=token;load(token);
})();
</script>
</body>
</html>
